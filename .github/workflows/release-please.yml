name: release-please

on:
  push:
    branches: [main]
  # Run it by hand (Actions > release-please > Run workflow), e.g. to rebuild
  # a release PR whose branch went stale.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: pnpm/action-setup@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}

      - run: pnpm run build
        if: ${{ steps.release.outputs.release_created }}

      # Trusted publishing (OIDC) and `npm stage` need a recent npm; the bundled one may be older.
      - run: npm install -g npm@latest
        if: ${{ steps.release.outputs.release_created }}

      # Staged, not direct: the trusted publisher only allows `npm stage publish`.
      # The version goes live after the maintainer approves it with 2FA
      # (`npm stage approve <stage-id>` or npmjs.com). Provenance is automatic.
      - run: npm stage publish
        if: ${{ steps.release.outputs.release_created }}
